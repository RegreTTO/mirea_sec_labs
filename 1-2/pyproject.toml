[project]
name = "mirea-file-manager"
version = "0.1.0"
description = "Учебный безопасный файловый менеджер с SQLite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.21,<1"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[project.scripts]
file-manager = "file_manager.cli.application:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "file_manager"
namespace = true
