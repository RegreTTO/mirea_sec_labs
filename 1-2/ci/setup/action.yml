name: Python CI environment
description: Install pinned Python tools and restore dependency caches
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
        key: python-${{ runner.os }}-${{ runner.arch }}-3.12.12-${{ hashFiles('1-2/uv.lock', '1-2/ci/requirements.txt', '1-2/ci/build-constraints.txt') }}
    - shell: bash
      working-directory: 1-2
      run: python -m pip install --require-hashes -r ci/requirements.txt
